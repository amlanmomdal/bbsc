<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <linearGradient id="flagGoldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDC42" />
      <stop offset="60%" stop-color="#F5BA13" />
      <stop offset="100%" stop-color="#E09F07" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Black Pole -->
  <line x1="26" y1="8" x2="26" y2="175" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round" />
  <circle cx="26" cy="8" r="5" fill="#F5BA13" stroke="#1A1A1A" stroke-width="2" />
  
  <!-- Flag Attachment Rings -->
  <rect x="23" y="24" width="6" height="4" rx="2" fill="#888" />
  <rect x="23" y="120" width="6" height="4" rx="2" fill="#888" />

  <!-- Waving Yellow Flag -->
  <g filter="url(#shadowGlow)">
    <path d="M 28,20 C 80,10 130,36 215,22 C 205,60 220,95 200,122 C 130,135 80,108 28,124 Z" 
          fill="url(#flagGoldBg)" 
          stroke="#1B4D2E" 
          stroke-width="3" 
          stroke-linejoin="round" />
          
    <!-- Realistic Fabric Folds & Shading -->
    <path d="M 85,22 C 95,55 80,95 88,121" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="6" />
    <path d="M 145,26 C 158,65 140,100 152,126" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="6" />

    <!-- Center Emblem Shield (matching reference photo) -->
    <!-- Outer Shield / Arch Outline in Dark Green -->
    <path d="M 80,48 C 80,32 150,32 150,48 L 145,74 C 145,74 115,70 85,74 Z" 
          fill="#F7C934" 
          stroke="#1B4D2E" 
          stroke-width="3.5" />

    <!-- Text BBSC inside Arch in Dark Green -->
    <text x="115" y="64" 
          font-family="'Outfit', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="16" 
          fill="#1B4D2E" 
          text-anchor="middle" 
          letter-spacing="3">B BSC</text>

    <!-- Center Red 5-Pointed Star -->
    <polygon points="115,72 119,83 130,83 121,90 125,101 115,94 105,101 109,90 100,83 111,83" 
             fill="#D32F2F" 
             stroke="#1B4D2E" 
             stroke-width="1.5" />

    <!-- ESTD 1990 Banner Ribbon in Dark Green Outline -->
    <path d="M 80,96 C 100,90 130,90 150,96 L 145,110 C 125,104 105,104 85,110 Z" 
          fill="#F7C934" 
          stroke="#1B4D2E" 
          stroke-width="3" />
    <text x="115" y="106" 
          font-family="'Outfit', sans-serif" 
          font-weight="900" 
          font-size="9" 
          fill="#1B4D2E" 
          text-anchor="middle" 
          letter-spacing="1">ESTD 1990</text>
  </g>
</svg>
